name: Release

on:
  push:
    branches:
      - master
    paths:
      - CHANGELOG.md
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Add env vars
        id: version
        run: |
          LATEST="$(changie latest)"
          echo "GORELEASER_CURRENT_TAG=$LATEST" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_PATH=.changes/$LATEST.md" >> "$GITHUB_ENV"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
      - name: Check if release tag already exists
        id: check-release
        run: |
          git fetch --tags --quiet
          if [ -z "$(git tag -l "${GORELEASER_CURRENT_TAG}")" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run GoReleaser
        if: steps.check-release.outputs.exists == 'false'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --release-notes=${{ env.RELEASE_NOTES_PATH }} --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Mirror the released plugin tarballs to get.pulumi.com.
  publish-binaries:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ESC_ACTION_OIDC_AUTH: true
      ESC_ACTION_OIDC_ORGANIZATION: pulumi
      ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
      ESC_ACTION_ENVIRONMENT: imports/github-secrets
      ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: "false"
    steps:
      - name: Fetch the AWS upload credentials from ESC
        id: esc-secrets
        uses: pulumi/esc-action@32dda43ffe7a2ab21e6bce11c781b44a3e5623cf # v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ steps.esc-secrets.outputs.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ steps.esc-secrets.outputs.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
          role-to-assume: ${{ steps.esc-secrets.outputs.AWS_UPLOAD_ROLE_ARN }}
          role-external-id: upload-pulumi-release
          role-session-name: pulumi-hcl@githubActions
      - name: Download the released binaries
        run: gh release download "${VERSION}" --pattern '*.tar.gz' --dir dist --repo "${{ github.repository }}"
      - name: Upload to get.pulumi.com
        run: aws s3 cp dist "s3://get.pulumi.com/releases/plugins/" --recursive

  # Publish the Go SDK to our sdk-releases branch, then tag it.
  publish-go-sdk:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # The sdk-releases commit that carries this version's registry payload
      # (registry/schema.json and registry/_index.md). Empty when the version was
      # already published, which skips the downstream registry dispatch.
      registry-sha: ${{ steps.commit.outputs.registry-sha }}
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.PULUMI_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sdk-releases
          token: ${{ secrets.PULUMI_BOT_TOKEN }}
      - name: Read the Go toolchain from the released source
        run: |
          git fetch --depth 1 origin "refs/tags/${VERSION}"
          mkdir -p "${RUNNER_TEMP}/go-toolchain"
          git show "FETCH_HEAD:go.mod" > "${RUNNER_TEMP}/go-toolchain/go.mod"
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ runner.temp }}/go-toolchain/go.mod
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        with:
          pulumi-version: "latest"
        env:
          GITHUB_TOKEN: ${{ secrets.PULUMI_BOT_TOKEN }}
      - name: Check if the Go SDK tag already exists
        id: already-tagged
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/sdk/go/${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the released provider binary
        if: steps.already-tagged.outputs.exists == 'false'
        run: |
          asset="pulumi-resource-hcl-${VERSION}-linux-amd64.tar.gz"
          gh release download "${VERSION}" --pattern "${asset}" --dir "${RUNNER_TEMP}"
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}" pulumi-resource-hcl
      - name: Generate the Go SDK into the sdk-releases branch
        if: steps.already-tagged.outputs.exists == 'false'
        run: |
          rm -rf sdk/go
          pulumi package gen-sdk "${RUNNER_TEMP}/pulumi-resource-hcl"
          cd sdk/go && go mod tidy
      - name: Copy README and LICENSE into the Go SDK module
        if: steps.already-tagged.outputs.exists == 'false'
        run: |
          git fetch --depth 1 origin "refs/tags/${VERSION}"
          git show "FETCH_HEAD:README.md" > sdk/go/README.md
          git show "FETCH_HEAD:LICENSE" > sdk/go/LICENSE
      - name: Render the .NET package icon as a real PNG
        if: steps.already-tagged.outputs.exists == 'false'
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          git show "FETCH_HEAD:assets/logo.svg" |
            rsvg-convert --width 128 --keep-aspect-ratio --output sdk/dotnet/logo.png
      - name: Assemble the registry payload
        if: steps.already-tagged.outputs.exists == 'false'
        run: |
          mkdir -p registry
          pulumi package get-schema "${RUNNER_TEMP}/pulumi-resource-hcl" > registry/schema.json
          git show "FETCH_HEAD:registry/_index.md" > registry/_index.md
      - name: Commit, tag, and push
        id: commit
        if: steps.already-tagged.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No SDK changes for ${VERSION}; mirror branch already up to date."
          else
            git commit -m "${VERSION}"
            git push origin sdk-releases
          fi
          git tag "sdk/go/${VERSION}"
          git push origin "sdk/go/${VERSION}"
          echo "registry-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Warm the Go module proxy
        if: steps.already-tagged.outputs.exists == 'false'
        continue-on-error: true
        run: |
          warmdir="$(mktemp -d)"
          (cd "$warmdir" && go mod init warm &&
            go get "github.com/${{ github.repository }}/sdk/go@${VERSION}")

  # Publish the TypeScript SDK to npm as @pulumi/hcl.
  #
  # publish-go-sdk regenerates every language's SDK onto the sdk-releases branch
  # (it runs `pulumi package gen-sdk` with no --language filter), so by the time
  # this job runs the branch holds the freshly versioned nodejs source.
  #
  # Publishing uses npm trusted publishing (OIDC): the id-token permission plus
  # the publish-npm environment stand in for an npm token. This requires a
  # trusted publisher for @pulumi/hcl configured on npmjs.org, bound to this
  # repository, workflow file, and environment.
  publish-nodejs:
    needs: publish-go-sdk
    runs-on: ubuntu-latest
    environment: publish-npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sdk-releases
      - uses: actions/setup-node@v6
        with:
          # Trusted publishing requires Node >= 22.14 and npm >= 11.5.1.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm meets the trusted-publishing floor
        run: npm install -g npm@11.5.1
      - name: Check if this version is already on npm
        id: published
        working-directory: sdk/nodejs
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.published.outputs.exists == 'false'
        working-directory: sdk/nodejs
        run: |
          npm install
          npm run build
          cp package.json README.md bin/
      - name: Publish
        if: steps.published.outputs.exists == 'false'
        working-directory: sdk/nodejs/bin
        run: npm publish --access public

  # Publish the Python SDK to PyPI as pulumi_hcl.
  #
  # As with nodejs, publish-go-sdk has already regenerated the versioned Python
  # source onto sdk-releases. The generated setup.py reads README.md relative to
  # sdk/python, but gen-sdk only writes it inside the package directory, so copy
  # it up before building or the PyPI long description falls back to a dev
  # placeholder.
  #
  # Publishing uses PyPI trusted publishing (OIDC) via the id-token permission
  # and the publish-pypi environment. This requires a trusted publisher for
  # pulumi_hcl configured on pypi.org (a pending publisher can be created
  # before the project exists), bound to this repository, workflow file, and
  # environment. skip-existing makes re-runs idempotent.
  publish-python:
    needs: publish-go-sdk
    runs-on: ubuntu-latest
    environment: publish-pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sdk-releases
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build distributions
        working-directory: sdk/python
        run: |
          cp pulumi_hcl/README.md README.md
          python -m pip install --upgrade build
          python -m build --sdist --wheel
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
          skip-existing: true

  # Publish the .NET SDK to NuGet as Pulumi.Hcl.
  #
  # As with the other SDKs, publish-go-sdk has already regenerated the versioned
  # dotnet source onto sdk-releases. The codegen pins the library to net6.0 for
  # maximum consumer compatibility (it runs fine on .NET 8+); the .NET 8 SDK
  # builds it without the 6.0 SDK because the net6.0 reference assemblies restore
  # from NuGet.
  #
  # NuGet trusted publishing (OIDC): NuGet/login exchanges the GitHub OIDC token
  # (id-token: write) for a short-lived, single-use API key. This requires a
  # trusted publishing policy configured on nuget.org, bound to this repository,
  # workflow file, and the publish-nuget environment. NUGET_USER is the nuget.org
  # profile or org slug that owns that policy (public, but kept as a secret per
  # NuGet's guidance). --skip-duplicate makes re-runs idempotent.
  publish-dotnet:
    needs: publish-go-sdk
    runs-on: ubuntu-latest
    environment: publish-nuget
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sdk-releases
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build
        working-directory: sdk/dotnet
        run: dotnet build -c Release
      - name: Pack
        working-directory: sdk/dotnet
        run: dotnet pack -c Release -o nupkgs --no-build
      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        working-directory: sdk/dotnet
        run: |
          dotnet nuget push 'nupkgs/*.nupkg' \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

  # Publish the Java SDK to Maven Central as com.pulumi:hcl.
  #
  # The generated build.gradle carries the whole publishing setup; secrets come
  # from ESC (Maven Central has no OIDC trusted publishing) via the same
  # org-wide environment pulumi-java's release uses. Maven Central rejects
  # re-publishing, so skip when the POM already exists; repo1.maven.org can lag
  # a publish by a few minutes, in which window a re-run fails loudly instead.
  publish-java:
    # release stays in `needs` because this job reads
    # needs.release.outputs.version below — the `needs` context only exposes
    # directly-listed jobs, it is not transitive.
    needs: [release, publish-go-sdk]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      ESC_ACTION_OIDC_AUTH: true
      ESC_ACTION_OIDC_ORGANIZATION: pulumi
      ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
      ESC_ACTION_ENVIRONMENT: imports/github-secrets
      ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: PUBLISH_REPO_USERNAME=OSSRH_USERNAME,PUBLISH_REPO_PASSWORD=OSSRH_PASSWORD,SIGNING_KEY=JAVA_SIGNING_KEY,SIGNING_PASSWORD=JAVA_SIGNING_PASSWORD
    steps:
      - name: Fetch the publishing secrets from ESC
        uses: pulumi/esc-action@32dda43ffe7a2ab21e6bce11c781b44a3e5623cf # v3
      - uses: actions/checkout@v7
        with:
          ref: sdk-releases
      - name: Check if this version is already on Maven Central
        id: published
        run: |
          url="https://repo1.maven.org/maven2/com/pulumi/hcl/${VERSION#v}/hcl-${VERSION#v}.pom"
          if curl --silent --fail --head --location "$url" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v5
        if: steps.published.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: '11'
      # Gradle 9 needs a JVM 17+ daemon; 8.x runs on the JDK 11 the toolchain wants.
      - uses: gradle/actions/setup-gradle@v6
        if: steps.published.outputs.exists == 'false'
        with:
          gradle-version: '8.14.5'
      - name: Publish
        if: steps.published.outputs.exists == 'false'
        working-directory: sdk/java
        run: gradle publishToSonatype closeAndReleaseSonatypeStagingRepository

  # Ask the Pulumi registry to publish docs for this version.
  #
  # publish-go-sdk committed registry/schema.json (version baked in by the
  # released provider binary) and registry/_index.md to the sdk-releases branch;
  # we pin the dispatch to that exact commit so the URLs are immutable. The
  # registry's `push-provider-update` handler reads the package version out of
  # the schema itself, so we send neither a ref nor a schema path.
  #
  # The dispatch is a cross-repo GitHub API call, which GitHub OIDC can't
  # authenticate on its own. Instead this job trades its GitHub OIDC token for a
  # Pulumi ESC session (no secret stored in this repo) and pulls the
  # dispatch-capable GitHub token out of the github-secrets/pulumi-hcl
  # environment, mirroring how pulumi/registry authenticates.
  publish-registry:
    needs: publish-go-sdk
    if: needs.publish-go-sdk.outputs.registry-sha != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      SHA: ${{ needs.publish-go-sdk.outputs.registry-sha }}
      ESC_ACTION_OIDC_AUTH: true
      ESC_ACTION_OIDC_ORGANIZATION: pulumi
      ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
      ESC_ACTION_ENVIRONMENT: github-secrets/pulumi-hcl
      ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: GITHUB_TOKEN=hcl-registry-publish-dispatch
    steps:
      - name: Fetch the dispatch token from ESC
        uses: pulumi/esc-action@32dda43ffe7a2ab21e6bce11c781b44a3e5623cf # v3
      - name: Dispatch a registry docs build
        run: |
          base="https://raw.githubusercontent.com/${{ github.repository }}/${SHA}/registry"
          jq -n \
            --arg schema "${base}/schema.json" \
            --arg index "${base}/_index.md" \
            '{
              event_type: "push-provider-update",
              client_payload: {
                "project-shortname": "hcl",
                "schema-url": $schema,
                "index-url": $index
              }
            }' \
          | gh api --method POST repos/pulumi/registry/dispatches --input -
