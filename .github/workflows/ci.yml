name: CI

on:
  workflow_call:

# Caching strategy: jobs restore the Go module and build caches but only
# master runs (see master.yml) save them. Pull requests restore master's
# cache and skip the save entirely, which keeps the multi-minute cache
# upload off the PR critical path. setup-go's built-in cache is disabled
# everywhere because its cache key is shared across jobs, so only one job's
# build cache would ever be saved.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-lint-${{ hashFiles('go.sum') }}
          restore-keys: go-lint-
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9.0
      - uses: actions/cache/save@v6
        if: always() && github.ref == 'refs/heads/master'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-lint-${{ hashFiles('go.sum') }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Shard definitions live in .github/scripts/test-shard.sh. Each
        # shard is its own runner, so wall time is bounded by the slowest
        # shard rather than the whole suite. cache-key groups shards with
        # similar build graphs; only the shard with cache-save set uploads
        # its cache (on master), the rest just restore it.
        include:
          - shard: unit
            cache-key: go-test-unit
            cache-save: true
          - shard: conformance-0
            cache-key: go-test-conformance
            cache-save: true
          - shard: conformance-1
            cache-key: go-test-conformance
          - shard: conformance-large
            cache-key: go-test-conformance
          - shard: tfcompat-0
            cache-key: go-test-unit
          - shard: tfcompat-1
            cache-key: go-test-unit
          - shard: tfcompat-2
            cache-key: go-test-unit
          - shard: smoke
            cache-key: go-test-unit
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ matrix.cache-key }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ matrix.cache-key }}-
            go-test-
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        with:
          pulumi-version: "dev"
        env:
          GITHUB_TOKEN: ${{ secrets.PULUMI_BOT_TOKEN }}
      - uses: opentofu/setup-opentofu@v2
      # terraform_remote_state lowers to the pulumi-terraform getLocalReference
      # invoke; the tfcompat harness disables plugin acquisition, so pre-install it.
      - run: pulumi plugin install resource terraform 6.1.0
      - run: pulumi plugin install resource terraform-provider 1.4.0 # renovate: github-releases pulumi/pulumi-terraform-provider
      - run: pulumi plugin install resource local 0.1.6
      - run: make bin/pulumi-language-hcl bin/pulumi-converter-hcl bin/pulumi-resource-hcl
      - run: echo "$PWD/bin" >> "$GITHUB_PATH"
      - run: .github/scripts/test-shard.sh ${{ matrix.shard }}
        env:
          # Enable the live terraform_remote_state `remote` backend test.
          TFE_ORGANIZATION: ${{ secrets.TFE_ORGANIZATION }}
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/cache/save@v6
        if: always() && github.ref == 'refs/heads/master' && matrix.cache-save
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ matrix.cache-key }}-${{ hashFiles('go.sum') }}

  # Tests are done, trigger codecov
  codecov-notify:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: codecov/codecov-action@v7
        with:
          run_command: send-notifications
          token: ${{ secrets.CODECOV_TOKEN }}

  build-sdk:
    # Generate every SDK and confirm each one builds with its native toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-sdk-${{ hashFiles('go.sum') }}
          restore-keys: go-sdk-
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        with:
          pulumi-version: "latest"
        env:
          GITHUB_TOKEN: ${{ secrets.PULUMI_BOT_TOKEN }}
      - run: make bin/pulumi-resource-hcl
      - run: pulumi package gen-sdk ./bin/pulumi-resource-hcl
      - name: Build Go SDK
        run: cd sdk/go && go mod tidy && go build ./...
      - name: Build Node.js SDK
        run: cd sdk/nodejs && npm install && npm run build
      - name: Build Python SDK
        run: cd sdk/python && python -m pip install build && python -m build
      - name: Build .NET SDK
        run: cd sdk/dotnet && dotnet build
      - name: Build Java SDK
        run: cd sdk/java && gradle build
      - uses: actions/cache/save@v6
        if: always() && github.ref == 'refs/heads/master'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-sdk-${{ hashFiles('go.sum') }}

  vendored-drift:
    # Ensures the vendored/ tree matches what `go generate ./vendored`
    # produces against the SHA pinned in vendored/doc.go. Catches both
    # hand-edits of MPL files and forgotten regens after a SHA bump.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go generate ./vendored
      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- vendored/; then
            echo "::error::vendored/ tree drifted from regen output. Run 'go generate ./vendored' locally and commit the result."
            exit 1
          fi
